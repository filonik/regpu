<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse interactive examples built with regpu." />
    <script>
      const savedTheme = localStorage.getItem('regpu-example-theme')
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.dataset.theme = savedTheme
      }
    </script>
    <title>regpu examples</title>
  </head>
  <body>
    <div id="app">
      <aside class="sidebar" aria-label="Example navigation">
        <header class="brand">
          <a class="brand-link" href="./" aria-label="regpu examples home">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>regpu</span>
          </a>
          <span class="brand-label">examples</span>
        </header>

        <label class="search">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="5.25"></circle>
            <path d="m12.5 12.5 4 4"></path>
          </svg>
          <span class="sr-only">Filter examples</span>
          <input
            id="example-filter"
            type="search"
            placeholder="Filter examples"
            autocomplete="off"
          />
          <kbd>/</kbd>
        </label>

        <nav id="example-list" class="example-list"></nav>

        <footer class="sidebar-footer">
          <a href="https://github.com/filonik/regpu" target="_blank" rel="noreferrer">
            GitHub
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3h8v8M13 3 4 12"></path></svg>
          </a>
        </footer>
      </aside>

      <main class="workspace">
        <header class="toolbar">
          <button
            id="menu-button"
            class="icon-button menu-button"
            aria-label="Open examples"
            aria-expanded="false"
          >
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M3 5h14M3 10h14M3 15h14"></path>
            </svg>
          </button>
          <div class="title-block">
            <h1 id="example-title">Examples</h1>
            <p id="example-description"></p>
          </div>
          <div class="toolbar-actions">
            <button id="theme-button" class="icon-button" aria-label="Switch color theme">
              <svg class="theme-icon-light" viewBox="0 0 20 20" aria-hidden="true">
                <circle cx="10" cy="10" r="3.25"></circle>
                <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M15.7 4.3l-1.4 1.4M5.7 14.3l-1.4 1.4"></path>
              </svg>
              <svg class="theme-icon-dark" viewBox="0 0 20 20" aria-hidden="true">
                <path d="M16 12.7A7 7 0 0 1 7.3 4 7 7 0 1 0 16 12.7Z"></path>
              </svg>
            </button>
            <button
              id="reload-button"
              class="icon-button"
              aria-label="Reload preview"
              title="Reload preview"
            >
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M15.7 7A6 6 0 1 0 16 12M15.7 7V3m0 4h-4"></path>
              </svg>
            </button>
            <a
              id="open-button"
              class="icon-button"
              href="#"
              target="_blank"
              aria-label="Open preview in a new tab"
              title="Open in new tab"
            >
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M11 4h5v5M16 4l-7 7M15 11v4H5V5h4"></path>
              </svg>
            </a>
          </div>
        </header>

        <section class="content">
          <section class="panel preview-panel" aria-labelledby="preview-heading">
            <div class="panel-heading">
              <h2 id="preview-heading">Preview</h2>
              <span class="status"><span></span> Live</span>
            </div>
            <div class="preview-frame">
              <div id="preview-loading" class="preview-loading">Loading example…</div>
              <iframe id="preview" title="Example preview" allow="fullscreen"></iframe>
            </div>
          </section>

          <section class="panel source-panel" aria-labelledby="source-heading">
            <div class="source-header">
              <h2 id="source-heading" class="sr-only">Source</h2>
              <div
                id="source-tabs"
                class="source-tabs"
                role="tablist"
                aria-label="Source files"
              ></div>
              <button id="copy-button" class="copy-button" type="button">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <rect x="7" y="7" width="9" height="9" rx="1"></rect>
                  <path d="M13 7V4H4v9h3"></path>
                </svg>
                <span>Copy</span>
              </button>
            </div>
            <div id="editor" class="editor"></div>
          </section>
        </section>
      </main>
      <button id="sidebar-backdrop" class="sidebar-backdrop" aria-label="Close examples"></button>
    </div>
    <script type="module" src="/browser.ts"></script>
  </body>
</html>
