<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Marching Cubes</title>
    <style>
      html,
      body {
        margin: 0;
        background: #05050a;
        overflow: hidden;
        height: 100%;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      #hint {
        position: fixed;
        bottom: 18px;
        left: 50%;
        translate: -50% 0;
        color: #c9d8e8;
        font:
          12px system-ui,
          sans-serif;
        letter-spacing: 0.04em;
        pointer-events: none;
        transition: opacity 1s;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div id="hint">drag to orbit &middot; scroll to zoom</div>
    <script type="module" src="main.ts"></script>
  </body>
</html>
